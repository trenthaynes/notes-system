[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notes-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "mcp>=1.27",
    "python-frontmatter>=1.1",
]

[project.scripts]
notes = "notes.cli:app"
notes-mcp = "notes.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notes"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]
